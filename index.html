<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的个人主页</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            background-image: url('https://github.com/linhoawa/linho/blob/main/1.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            align-items: stretch;
        }

        /* ===== 左侧栏 ===== */
        .left-card {
            width: 260px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.05);
            /* a=0.02 微透明白 */
            padding: 40px 24px 30px;
            border-radius: 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-right: 1px solid rgba(255, 255, 255, 0.10);
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 18px;
            display: block;
            border: 3px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0);
        }

        .name {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            line-height: 1.3;
        }

        .bio {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.85);
            margin: 6px 0 22px;
            line-height: 1.5;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.25);
        }

        .socials {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .socials a {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.3rem;
            background: rgba(255, 255, 255, 0);
            width: 46px;
            height: 46px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.10);
            transition: all 0.25s ease;
        }

        .socials a:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.04);
            transform: scale(1.08);
        }

        /* ===== 右侧栏 ===== */
        .right-content {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            /* a=0.02 微透明白 */
            padding: 40px 40px 30px;
            border-radius: 0;
        }

        .section-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.25);
        }

        .section-title i {
            color: rgba(255, 255, 255, 0.4);
            font-size: 1.2rem;
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 14px;
            margin-bottom: 28px;
        }

        .project-card {
            background: rgba(255, 255, 255, 0);
            border-radius: 12px;
            padding: 16px 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.25s ease;
            text-decoration: none;
            color: #ffffff;
        }

        .project-card:hover {
            background: rgba(255, 255, 255, 0.04);
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.18);
        }

        .project-card h4 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .project-card p {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .article-list {
            list-style: none;
            margin-bottom: 26px;
        }

        .article-list li {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .article-list li:last-child {
            border-bottom: none;
        }

        .article-list a {
            text-decoration: none;
            color: #ffffff;
            font-weight: 500;
            transition: color 0.15s;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.15);
        }

        .article-list a:hover {
            color: rgba(255, 255, 255, 0.6);
        }

        .article-list .date {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
        }

        .tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 4px;
        }

        .tag-group span {
            background: rgba(255, 255, 255, 0);
            color: rgba(255, 255, 255, 0.8);
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        @media (max-width: 700px) {
            .container {
                flex-direction: column;
                min-height: 100vh;
            }
            .left-card {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.06);
                padding: 28px 20px;
            }
            .right-content {
                padding: 24px 20px;
            }
            .avatar {
                width: 90px;
                height: 90px;
            }
            .name {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <aside class="left-card">
            <img class="avatar" src="https://via.placeholder.com/200/cccccc/666666?text=Avatar" alt="头像" />
            <div class="name">你的名字</div>
            <div class="bio">🌱 全栈开发者 · 保持好奇</div>
            <div class="socials">
                <a href="#"><i class="fab fa-github"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-bilibili"></i></a>
                <a href="#"><i class="fas fa-envelope"></i></a>
            </div>
        </aside>

        <main class="right-content">

            <div class="section-title">
                <i class="fas fa-code"></i> 我的项目
            </div>
            <div class="project-grid">
                <a href="#" class="project-card">
                    <h4>项目 A</h4>
                    <p>简短描述这个项目</p>
                </a>
                <a href="#" class="project-card">
                    <h4>项目 B</h4>
                    <p>一句话介绍亮点</p>
                </a>
                <a href="#" class="project-card">
                    <h4>项目 C</h4>
                    <p>工具 / 网站 / 应用</p>
                </a>
                <a href="#" class="project-card">
                    <h4>项目 D</h4>
                    <p>再加一个凑成四宫格</p>
                </a>
            </div>

            <div class="section-title">
                <i class="fas fa-pen-fancy"></i> 最新动态
            </div>
            <ul class="article-list">
                <li>
                    <a href="#">个人主页搭建教程</a>
                    <span class="date">2026-08-17</span>
                </li>
                <li>
                    <a href="#">Vue 3 组合式 API 实战</a>
                    <span class="date">2026-08-12</span>
                </li>
                <li>
                    <a href="#">Vercel 部署静态站点</a>
                    <span class="date">2026-08-05</span>
                </li>
            </ul>

            <div class="section-title">
                <i class="fas fa-tag"></i> 技术栈
            </div>
            <div class="tag-group">
                <span>Vue</span>
                <span>React</span>
                <span>Python</span>
                <span>TypeScript</span>
            </div>

        </main>

    </div>

</body>
</html>
