<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>灵霍的个人主页</title>

    <!-- ===== 国内 CDN ===== -->
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.cn/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.cn/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />

    <style>
        /* ===== 重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            width: 100%;
        }

        /* ===== 开场动画 ===== */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            background: url('https://s41.ax1x.com/2026/08/19/pmvLb01.jpg') center/cover no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity .8s ease, visibility .8s ease;
        }
        #splash-screen::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, .35);
            z-index: 0;
        }
        #splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* 光晕 */
        .splash-bg-glow {
            position: absolute;
            width: 700px;
            height: 500px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(ellipse at center, rgba(0, 255, 255, .08), rgba(0, 255, 255, .02) 40%, transparent 70%);
            border-radius: 50%;
            animation: glow-pulse 4s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes glow-pulse {
            0% {
                transform: translate(-50%, -50%) scale(.9);
                opacity: .4;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.3);
                opacity: 1;
            }
        }

        .splash-center {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 边框 */
        .splash-border-wrapper {
            position: relative;
            display: inline-block;
            padding: 4px;
            border-radius: 32px;
            background: linear-gradient(135deg, rgba(0, 255, 255, .6), rgba(0, 255, 255, .15) 30%, rgba(0, 255, 255, .05) 50%, rgba(0, 255, 255, .15) 70%, rgba(0, 255, 255, .6));
            animation: border-rotate 6s linear infinite;
            box-shadow: 0 0 40px rgba(0, 255, 255, .15), 0 0 80px rgba(0, 255, 255, .08), inset 0 0 40px rgba(0, 255, 255, .05);
        }
        @keyframes border-rotate {
            0%,
            100% {
                background: linear-gradient(135deg, rgba(0, 255, 255, .6), rgba(0, 255, 255, .15) 30%, rgba(0, 255, 255, .05) 50%, rgba(0, 255, 255, .15) 70%, rgba(0, 255, 255, .6));
            }
            25% {
                background: linear-gradient(225deg, rgba(0, 255, 255, .6), rgba(0, 255, 255, .15) 30%, rgba(0, 255, 255, .05) 50%, rgba(0, 255, 255, .15) 70%, rgba(0, 255, 255, .6));
            }
            50% {
                background: linear-gradient(315deg, rgba(0, 255, 255, .6), rgba(0, 255, 255, .15) 30%, rgba(0, 255, 255, .05) 50%, rgba(0, 255, 255, .15) 70%, rgba(0, 255, 255, .6));
            }
            75% {
                background: linear-gradient(45deg, rgba(0, 255, 255, .6), rgba(0, 255, 255, .15) 30%, rgba(0, 255, 255, .05) 50%, rgba(0, 255, 255, .15) 70%, rgba(0, 255, 255, .6));
            }
        }

        /* 旋转光效 */
        .splash-border-wrapper::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 34px;
            padding: 2px;
            background: conic-gradient(from 0deg, transparent, rgba(0, 255, 255, .3) 30deg, rgba(0, 255, 255, .8) 60deg, rgba(0, 255, 255, .3) 90deg, transparent 120deg, transparent 240deg, rgba(0, 255, 255, .3) 270deg, rgba(0, 255, 255, .8) 300deg, rgba(0, 255, 255, .3) 330deg, transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: spin-border 4s linear infinite;
            opacity: .6;
            pointer-events: none;
        }
        @keyframes spin-border {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* 外发光 */
        .splash-border-wrapper::after {
            content: '';
            position: absolute;
            inset: -20px;
            border-radius: 50px;
            background: radial-gradient(ellipse at center, rgba(0, 255, 255, .06), transparent 70%);
            animation: outer-glow 2.5s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: -1;
        }
        @keyframes outer-glow {
            0% {
                transform: scale(.95);
                opacity: .3;
            }
            100% {
                transform: scale(1.1);
                opacity: .8;
            }
        }

        .splash-content {
            position: relative;
            z-index: 1;
            border-radius: 28px;
            background: rgba(10, 30, 60, .35);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            overflow: hidden;
            animation: splash-fade-up 1s ease;
        }
        @keyframes splash-fade-up {
            0% {
                opacity: 0;
                transform: translateY(36px) scale(.94);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .splash-glass {
            padding: 52px 60px 44px;
            text-align: center;
            min-width: 380px;
            position: relative;
            background: transparent;
        }
        .splash-glass::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(0, 255, 255, .03), transparent 60%);
            pointer-events: none;
        }

        .splash-icon {
            font-size: 3rem;
            color: rgba(0, 255, 255, .25);
            margin-bottom: 16px;
            animation: icon-pulse 2.5s ease-in-out infinite;
        }
        @keyframes icon-pulse {
            0%,
            100% {
                transform: scale(1);
                color: rgba(0, 255, 255, .2);
            }
            50% {
                transform: scale(1.05);
                color: rgba(0, 255, 255, .4);
            }
        }

        .splash-title {
            font-family: 'Playfair Display', 'Noto Serif SC', serif;
            font-size: 3rem;
            font-weight: 400;
            font-style: italic;
            color: #fff;
            letter-spacing: 6px;
            text-shadow: 0 0 60px rgba(0, 255, 255, .08);
        }
        .splash-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 2px;
            margin: 12px auto 0;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, .4), transparent);
            border-radius: 2px;
        }

        .splash-sub {
            font-family: 'Noto Serif SC', 'Playfair Display', serif;
            font-size: .85rem;
            font-weight: 300;
            color: rgba(255, 255, 255, .2);
            letter-spacing: 10px;
            margin-top: 16px;
            margin-bottom: 30px;
        }

        .splash-hint {
            font-family: 'Noto Serif SC', 'Segoe UI', sans-serif;
            font-size: .75rem;
            font-weight: 300;
            color: rgba(0, 255, 255, .25);
            letter-spacing: 6px;
            border: 1px solid rgba(0, 255, 255, .08);
            padding: 12px 40px;
            border-radius: 40px;
            display: inline-block;
            background: rgba(0, 255, 255, .02);
            transition: all .4s ease;
            animation: blink 2.4s ease-in-out infinite;
        }
        .splash-hint:hover {
            border-color: rgba(0, 255, 255, .2);
            color: rgba(0, 255, 255, .4);
            background: rgba(0, 255, 255, .04);
            box-shadow: 0 0 30px rgba(0, 255, 255, .05);
            transform: scale(1.02);
        }
        @keyframes blink {
            0%,
            100% {
                opacity: .2;
            }
            50% {
                opacity: .6;
            }
        }

        .splash-ripple {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(0, 255, 255, .25);
            animation: ripple-out .9s ease forwards;
            pointer-events: none;
            z-index: 20;
        }
        @keyframes ripple-out {
            0% {
                width: 0;
                height: 0;
                opacity: 1;
            }
            100% {
                width: 500px;
                height: 500px;
                opacity: 0;
            }
        }

        .splash-exit {
            animation: exit .7s ease forwards !important;
        }
        @keyframes exit {
            0% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(1.06);
            }
        }
        .splash-bg-exit {
            animation: fade-out .7s ease forwards !important;
        }
        @keyframes fade-out {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }

        /* ===== 个人主页 ===== */
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            background: url('https://s41.ax1x.com/2026/08/19/pmvLb01.jpg') center/cover fixed no-repeat;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            align-items: stretch;
        }

        /* ===== 左侧栏 ===== */
        .left-card {
            width: 260px;
            flex-shrink: 0;
            background: rgba(105, 105, 105, .2);
            padding: 40px 24px 30px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 18px;
            border: 3px solid rgba(255, 255, 255, .4);
            box-shadow: 0 4px 20px rgba(0, 0, 0, .1);
        }
        .name {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 12px rgba(0, 0, 0, .3);
        }
        .bio {
            font-size: .95rem;
            color: rgba(255, 255, 255, .85);
            margin-top: 6px;
            text-shadow: 0 1px 6px rgba(0, 0, 0, .25);
        }
        .socials {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding-top: 20px;
        }
        .socials a {
            color: rgba(255, 255, 255, .7);
            font-size: 1.3rem;
            width: 46px;
            height: 46px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, .1);
            transition: all .25s ease;
        }
        .socials a:hover {
            color: #fff;
            background: rgba(255, 255, 255, .04);
            transform: scale(1.08);
        }

        /* ===== 右侧主内容 ===== */
        .right-content {
            flex: 1;
            background: rgba(105, 105, 105, .2);
            padding: 40px 40px 30px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .hero-title {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 2.8rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 16px rgba(0, 0, 0, .5);
            margin-bottom: 20px;
        }

        .row-1,
        .row-2 {
            width: 100%;
            display: flex;
            gap: 16px;
        }
        .row-1 {
            margin-bottom: 16px;
            align-items: stretch;
        }
        .row-2 {
            align-items: flex-start;
        }

        /* ===== 搜索框 ===== */
        .search-container {
            flex: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: rgba(105, 105, 105, .2);
            border-radius: 16px;
            padding: 16px 20px;
            min-height: 100px;
        }
        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 40px;
            padding: 4px 4px 4px 20px;
            transition: all .3s ease;
        }
        .search-box:focus-within {
            background: rgba(255, 255, 255, .1);
            border-color: rgba(255, 255, 255, .25);
            box-shadow: 0 0 20px rgba(255, 255, 255, .04);
        }
        .search-icon {
            color: rgba(255, 255, 255, .5);
            font-size: .9rem;
            margin-right: 12px;
        }
        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: .95rem;
            padding: 10px 0;
            font-family: inherit;
        }
        .search-input::placeholder {
            color: rgba(255, 255, 255, .5);
        }
        .search-btn {
            background: rgba(255, 255, 255, .08);
            border: none;
            border-radius: 40px;
            color: #fff;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all .2s ease;
            flex-shrink: 0;
        }
        .search-btn:hover {
            background: rgba(255, 255, 255, .16);
        }

        /* ===== 时钟 ===== */
        .time-widget {
            flex: 1;
            background: rgba(105, 105, 105, .2);
            border-radius: 16px;
            padding: 16px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100px;
        }
        .time-display {
            font-size: 2.2rem;
            font-weight: 700;
            color: #fff;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, .25);
        }
        .date-display {
            font-size: .8rem;
            color: rgba(255, 255, 255, .6);
            margin-top: 4px;
            letter-spacing: 1px;
        }

        /* ===== 个人资料卡 ===== */
        .profile-wrapper {
            flex: 2;
            display: flex;
            justify-content: center;
        }
        .profile-card {
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(105, 105, 105, .4);
            box-shadow: 0 0 30px rgba(0, 0, 0, .15);
            transition: transform .3s ease;
        }
        .profile-card:hover {
            transform: translateY(-4px);
        }
        .profile-banner {
            width: 100%;
            height: 140px;
            overflow: hidden;
        }
        .profile-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-avatar-wrap {
            display: flex;
            justify-content: center;
            margin-top: -44px;
            position: relative;
            z-index: 2;
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, .4);
            overflow: hidden;
            background: rgba(105, 105, 105, .4);
            box-shadow: 0 4px 16px rgba(0, 0, 0, .2);
        }
        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .profile-info {
            text-align: center;
            padding: 16px 24px 4px;
        }
        .profile-name {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 1px 8px rgba(0, 0, 0, .3);
        }
        .profile-role {
            font-size: 13px;
            color: rgba(255, 255, 255, .6);
            margin-top: 2px;
        }
        .profile-about {
            margin: 12px 0 16px;
            color: rgba(255, 255, 255, .85);
            font-size: 14px;
            line-height: 1.6;
            text-shadow: 0 1px 6px rgba(0, 0, 0, .2);
        }
        .profile-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 44px;
            background: rgba(105, 105, 105, .1);
            color: rgba(255, 255, 255, .8);
            font-size: 13px;
            border-top: 1px solid rgba(255, 255, 255, .06);
        }

        /* ===== 音乐卡片 ===== */
        .music-card {
            flex: 1;
            background: rgba(105, 105, 105, .25);
            border-radius: 20px;
            padding: 20px 16px 18px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, .08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, .12);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all .4s ease;
            min-height: 160px;
            position: relative;
            overflow: hidden;
        }
        .music-card:hover {
            background: rgba(105, 105, 105, .35);
            border-color: rgba(255, 255, 255, .15);
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, .18);
        }
        .music-icon {
            font-size: 2.4rem;
            color: rgba(255, 255, 255, .25);
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }
        .music-info {
            width: 100%;
            text-align: center;
            margin-bottom: 12px;
        }
        .music-title {
            font-size: .95rem;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 1px 8px rgba(0, 0, 0, .3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .music-artist {
            font-size: .7rem;
            color: rgba(255, 255, 255, .4);
            margin-top: 2px;
        }
        .music-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .music-controls button {
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .04);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            color: rgba(255, 255, 255, .7);
            font-size: .85rem;
            cursor: pointer;
            transition: all .25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .music-controls button:hover {
            background: rgba(255, 255, 255, .14);
            color: #fff;
            transform: scale(1.06);
        }
        .music-controls .play-btn {
            width: 48px;
            height: 48px;
            font-size: 1.2rem;
            background: rgba(255, 255, 255, .1);
            border-color: rgba(255, 255, 255, .08);
            color: #fff;
            box-shadow: 0 4px 16px rgba(0, 0, 0, .15);
        }
        .music-controls .play-btn:hover {
            background: rgba(255, 255, 255, .2);
            transform: scale(1.08);
            box-shadow: 0 6px 24px rgba(0, 0, 0, .2);
        }
        .music-status-text {
            font-size: .55rem;
            color: rgba(255, 255, 255, .2);
            margin-top: 8px;
            letter-spacing: .8px;
            text-transform: uppercase;
            font-weight: 300;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 700px) {
            .container {
                flex-direction: column;
            }
            .left-card {
                width: 100%;
                padding: 28px 20px;
            }
            .right-content {
                padding: 24px 20px;
            }
            .row-1,
            .row-2 {
                flex-direction: column;
                gap: 12px;
            }
            .search-container {
                min-height: auto;
                padding: 14px 16px;
            }
            .time-widget {
                min-height: 80px;
            }
            .music-card {
                min-height: 120px;
                padding: 16px;
            }
            .profile-wrapper {
                flex: none;
                width: 100%;
            }
            .profile-card {
                max-width: 100%;
            }
            .profile-banner {
                height: 100px;
            }
            .profile-avatar {
                width: 64px;
                height: 64px;
            }
            .profile-avatar-wrap {
                margin-top: -36px;
            }
            .avatar {
                width: 90px;
                height: 90px;
            }
            .name {
                font-size: 1.5rem;
            }
            .hero-title {
                font-size: 2rem;
            }
            .time-display {
                font-size: 1.8rem;
            }
            .splash-glass {
                padding: 36px 28px 32px;
                min-width: auto;
                width: 90vw;
            }
            .splash-title {
                font-size: 2.2rem;
                letter-spacing: 4px;
            }
            .splash-icon {
                font-size: 2.4rem;
            }
            .splash-sub {
                letter-spacing: 6px;
                font-size: .7rem;
            }
            .splash-hint {
                letter-spacing: 4px;
                padding: 10px 28px;
                font-size: .7rem;
            }
            .splash-border-wrapper {
                padding: 3px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 开场动画 ===== -->
    <div id="splash-screen">
        <div class="splash-bg-glow"></div>
        <div class="splash-center">
            <div class="splash-border-wrapper" id="splashBorderWrapper">
                <div class="splash-content" id="splashContent">
                    <div class="splash-glass">
                        <div class="splash-icon"><i class="fas fa-compact-disc"></i></div>
                        <div class="splash-title">灵 霍</div>
                        <div class="splash-sub">✦ 个 人 空 间 ✦</div>
                        <div class="splash-hint">✦ 点 击 进 入 ✦</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 个人主页 ===== -->
    <div class="container">
        <!-- 左侧栏 -->
        <aside class="left-card">
            <div class="left-top">
                <img class="avatar" src="https://s41.ax1x.com/2026/08/19/pmvLqTx.jpg" alt="头像" />
                <div class="name">灵霍</div>
                <div class="bio">一个会一点点前端的兽</div>
            </div>
            <div class="socials">
                <a href="#"><i class="fab fa-github"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-bilibili"></i></a>
            </div>
        </aside>

        <!-- 右侧主内容 -->
        <main class="right-content">
            <div class="hero-title">Hi, I'm linho</div>

            <!-- 第一行：搜索 + 时钟 -->
            <div class="row-1">
                <div class="search-container">
                    <div class="search-box">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" id="searchInput" class="search-input" placeholder="输入网址或搜索内容..." onkeydown="if(event.key==='Enter')handleSearch()" />
                        <button class="search-btn" onclick="handleSearch()">
                            <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
                <div class="time-widget">
                    <div class="time-display" id="timeDisplay">--:--:--</div>
                    <div class="date-display" id="dateDisplay">----年--月--日</div>
                </div>
            </div>

            <!-- 第二行：资料卡 + 音乐 -->
            <div class="row-2">
                <div class="profile-wrapper">
                    <div class="profile-card">
                        <div class="profile-banner">
                            <img src="https://s41.ax1x.com/2026/08/19/pmvLyOs.jpg" alt="横幅" />
                        </div>
                        <div class="profile-avatar-wrap">
                            <div class="profile-avatar">
                                <img src="https://s41.ax1x.com/2026/08/19/pmvLqTx.jpg" alt="头像" />
                            </div>
                        </div>
                        <div class="profile-info">
                            <div class="profile-name">灵霍</div>
                            <div class="profile-role">linho</div>
                            <div class="profile-about">一个会一点点前端的兽</div>
                        </div>
                        <div class="profile-footer">
                            <span>awa</span>
                        </div>
                    </div>
                </div>

                <div class="music-card">
                    <div class="music-icon"><i class="fas fa-music"></i></div>
                    <div class="music-info">
                        <div class="music-title">猫的舞步</div>
                        <div class="music-artist">Candy_Wind</div>
                    </div>
                    <div class="music-controls">
                        <button onclick="togglePlay()" class="play-btn" id="playBtn">
                            <i class="fas fa-play" id="playIcon"></i>
                        </button>
                    </div>
                    <div class="music-status-text" id="musicStatus">⏸ 等待播放</div>
                </div>
            </div>
        </main>
    </div>

    <!-- ===== 音频（muted 静音启动，点击后取消静音） ===== -->
    <audio id="bgMusic" preload="auto" loop muted>
        <source src="https://cdn.jsdelivr.net/gh/linhoawa/linho@main/Candy_Wind%20-%20%E7%8C%AB%E7%9A%84%E8%88%9E%E6%AD%A5.mp3" type="audio/mpeg">
    </audio>

    <script>
        const splashScreen = document.getElementById('splash-screen');
        const splashContent = document.getElementById('splashContent');
        const splashBorderWrapper = document.getElementById('splashBorderWrapper');
        const splashBgGlow = document.querySelector('.splash-bg-glow');
        const audio = document.getElementById('bgMusic');
        const playIcon = document.getElementById('playIcon');
        const musicStatus = document.getElementById('musicStatus');
        let musicStarted = false;

        // ===== 开场点击 =====
        splashScreen.addEventListener('click', function(e) {
            // 涟漪效果
            const rect = splashContent.getBoundingClientRect();
            const ripple = document.createElement('div');
            ripple.className = 'splash-ripple';
            const x = (e.clientX || e.touches?.[0]?.clientX || window.innerWidth / 2) - rect.left;
            const y = (e.clientY || e.touches?.[0]?.clientY || window.innerHeight / 2) - rect.top;
            ripple.style.left = (x - 250) + 'px';
            ripple.style.top = (y - 250) + 'px';
            splashContent.appendChild(ripple);
            setTimeout(() => ripple.remove(), 900);

            // 淡出
            splashContent.classList.add('splash-exit');
            splashBorderWrapper.classList.add('splash-bg-exit');
            if (splashBgGlow) splashBgGlow.classList.add('splash-bg-exit');

            // ===== 播放音乐（关键修复） =====
            if (!musicStarted) {
                audio.muted = false; // 取消静音
                audio.currentTime = 0;
                audio.play().then(() => {
                    musicStarted = true;
                    playIcon.className = 'fas fa-pause';
                    musicStatus.textContent = '● 播放中 · 循环';
                }).catch(() => {
                    // 如果被阻止，静音播放
                    audio.muted = true;
                    audio.play();
                    // 提示用户点击播放按钮
                    musicStatus.textContent = '⚠ 点击播放按钮';
                });
            }

            setTimeout(() => splashScreen.classList.add('hidden'), 800);
        });

        // ===== 时钟 =====
        function updateClock() {
            const now = new Date();
            document.getElementById('timeDisplay').textContent =
                String(now.getHours()).padStart(2, '0') + ':' +
                String(now.getMinutes()).padStart(2, '0') + ':' +
                String(now.getSeconds()).padStart(2, '0');
            document.getElementById('dateDisplay').textContent =
                now.getFullYear() + '年' +
                String(now.getMonth() + 1).padStart(2, '0') + '月' +
                String(now.getDate()).padStart(2, '0') + '日';
        }
        updateClock();
        setInterval(updateClock, 1000);

        // ===== 搜索 =====
        function handleSearch() {
            const input = document.getElementById('searchInput');
            const query = input.value.trim();
            if (!query) return;
            const isUrl = /^https?:\/\//i.test(query) || (/^[a-zA-Z0-9-]+\.[a-zA-Z]{2,}/.test(query) && !/\s/.test(query));
            window.location.href = isUrl ?
                (query.startsWith('http') ? query : 'https://' + query) :
                'https://www.baidu.com/s?wd=' + encodeURIComponent(query);
        }

        // ===== 音乐控制 =====
        let isPlaying = false;
        audio.addEventListener('play', () => {
            isPlaying = true;
            playIcon.className = 'fas fa-pause';
            musicStatus.textContent = '● 播放中 · 循环';
        });
        audio.addEventListener('pause', () => {
            isPlaying = false;
            playIcon.className = 'fas fa-play';
            musicStatus.textContent = '⏸ 已暂停 · 循环';
        });
        audio.addEventListener('ended', () => {
            if (isPlaying) {
                audio.currentTime = 0;
                audio.play();
            }
        });

        function togglePlay() {
            if (audio.paused) {
                audio.muted = false;
                audio.play();
            } else {
                audio.pause();
            }
        }

        // 5秒后自动静音播放（跳过自动播放限制）
        setTimeout(() => {
            if (!musicStarted) {
                audio.muted = true;
                audio.currentTime = 0;
                audio.play().catch(() => {});
            }
        }, 5000);
    </script>
</body>
</html>
